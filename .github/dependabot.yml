version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 10
    reviewers:
      - 'Jasper-Leung'
    labels:
      - 'dependencies'
      - 'automated'
    ignore:
      - dependency-name: 'electron'
        update-types: ['version-update:semver-major']
    versioning-strategy: increase
    commit-message:
      prefix: 'chore'
      prefix-development: 'chore'
      include: 'scope'
